server {
    listen 80;
    listen [::]:80;

    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Los assets de Vite llevan hash en el nombre, así que se pueden cachear.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Mismo proxy /api que Vite. La barra final elimina el prefijo /api/.
    location /api/ {
        proxy_pass https://api.tonerinksas.com/;
        proxy_ssl_server_name on;
        proxy_ssl_name api.tonerinksas.com;
        proxy_set_header Host api.tonerinksas.com;
        # Son solicitudes servidor a servidor; el navegador usa el mismo origen.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
    }

    # SPA: cualquier ruta desconocida (/catalogo, /admin…) la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
