server {
    listen 80;
    listen [::]:80;

    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Los assets de Vite llevan hash en el nombre, así que se pueden cachear.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida (/catalogo, /admin…) la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
